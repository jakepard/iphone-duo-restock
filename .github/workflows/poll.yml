name: Check iPhone Duo stock near 11230
on:
  schedule:
    # Requested five-minute cadence. GitHub may delay or skip scheduled runs.
    - cron: '3/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-duo-poll
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Apple pickup inventory within 50 miles of 11230
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${VERCEL_URL:-}" ] && [ -n "${CRON_SECRET:-}" ] || { echo 'Missing Actions secrets'; exit 1; }
          curl --silent --show-error --fail-with-body --max-time 225 \
            --request POST "${VERCEL_URL%/}/api/check" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header 'Content-Type: application/json'
